<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="Work in progress: DeskMate, WeMove, Agentry Labs, Gentleman's Stack"><title>Work in progress: DeskMate, WeMove, Agentry Labs, Gentleman's Stack</title><rect width="1280" height="520" rx="16" fill="#111418"/><text x="35" y="52" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#c9754a" letter-spacing="3">ON THE WORKBENCH</text><text x="35" y="84" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="28" font-weight="500" fill="#eef0f2" >What I'm building right now</text><rect x="35" y="110" width="600" height="190" rx="12" fill="#181c21" stroke="#2a3038" stroke-dasharray="1 0"/><text x="59" y="152" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="26" font-weight="500" fill="#eef0f2" >DeskMate</text><rect x="523" y="132" width="88" height="26" rx="13" fill="none" stroke="#c9754a"/><text x="567.0" y="149" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#c9754a" text-anchor="middle" letter-spacing="1.5">BUILDING</text><text x="59" y="186" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c3c9d0" >Your phone as a remote control for your Mac. Taps, shakes and tilts trigger actions.</text><text x="59" y="240" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#c9754a" letter-spacing="2">NOW</text><text x="101" y="240" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8d959e" >Plugin kit, a Home Assistant plugin and live info tiles are in.</text><text x="59" y="280" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#8d959e" >Flutter · TypeScript · Hammerspoon</text><rect x="660" y="110" width="600" height="190" rx="12" fill="#181c21" stroke="#2a3038" stroke-dasharray="1 0"/><text x="684" y="152" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="26" font-weight="500" fill="#eef0f2" >WeMove</text><rect x="1148" y="132" width="88" height="26" rx="13" fill="none" stroke="#c9754a"/><text x="1192.0" y="149" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#c9754a" text-anchor="middle" letter-spacing="1.5">BUILDING</text><text x="684" y="186" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c3c9d0" >A group accountability engine against fitness drop-off.</text><text x="684" y="240" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#c9754a" letter-spacing="2">NOW</text><text x="726" y="240" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8d959e" >Foundation is done: sign-in, onboarding, settings and an offline-first</text><text x="726" y="259" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8d959e" >exercise catalog.</text><text x="684" y="280" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#8d959e" >Flutter · Firebase · MongoDB</text><rect x="35" y="320" width="600" height="190" rx="12" fill="#181c21" stroke="#2a3038" stroke-dasharray="1 0"/><text x="59" y="362" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="26" font-weight="500" fill="#eef0f2" >Agentry Labs</text><rect x="547" y="342" width="64" height="26" rx="13" fill="none" stroke="#c9754a"/><text x="579.0" y="359" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#c9754a" text-anchor="middle" letter-spacing="1.5">ALPHA</text><text x="59" y="396" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c3c9d0" >Reusable skills, rules and agents for Claude Code, Copilot and Cursor.</text><text x="59" y="450" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#c9754a" letter-spacing="2">NOW</text><text x="101" y="450" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8d959e" >A skill shelf to switch rarely used groups on and off. Public on GitHub.</text><text x="59" y="490" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#8d959e" >Claude Code · MCP · Copilot</text><rect x="660" y="320" width="600" height="190" rx="12" fill="#181c21" stroke="#2a3038" stroke-dasharray="1 0"/><text x="684" y="362" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="26" font-weight="500" fill="#eef0f2" >Gentleman's Stack</text><rect x="1148" y="342" width="88" height="26" rx="13" fill="none" stroke="#c9754a"/><text x="1192.0" y="359" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#c9754a" text-anchor="middle" letter-spacing="1.5">BUILDING</text><text x="684" y="396" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c3c9d0" >An opinionated Nx monorepo to generate new products from.</text><text x="684" y="450" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#c9754a" letter-spacing="2">NOW</text><text x="726" y="450" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fon